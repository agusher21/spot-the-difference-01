<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firefly Hollow — Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, -apple-system, sans-serif; }
  #game, #hud { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #game { z-index: 1; }
  #hud { z-index: 10; pointer-events: none; }
  /* Screen reader status */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Firefly Hollow: Spot the difference between two side-by-side scenes. Click or press Enter to mark differences. H for hint, R to restart, 1/2/3 to switch scenes, arrows to move reticle, M for magnifier, P to pause."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./src/config.js"></script>
<script src="./src/random.js"></script>
<script src="./src/world.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/render.js"></script>
<script src="./src/input.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
